[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fireweed-mcp"
version = "0.4.0"
description = "Agent memory where every fact carries a receipt — a deterministic gate decides what is remembered, and erasure issues a signed certificate."
readme = "README.md"
requires-python = ">=3.9"
# SPDX has no identifier for FSL, so declare it as a LicenseRef and carry the text as
# a license file. Previously `license = {file=...}` dumped the ENTIRE licence text into
# PyPI's license field and set no classifier, which is why indexers reported the
# package as having no detectable licence at all.
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [{ name = "Sanyam Sood" }]
keywords = ["mcp", "model-context-protocol", "agent-memory", "provenance", "audit", "gdpr", "erasure", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "License :: Other/Proprietary License",
]

# No dependencies. Nothing here calls an LLM, and the MCP protocol is implemented directly over
# stdio JSON-RPC — the official SDK needs Python 3.10+ and this engine runs on 3.9. A dependency
# list is a promise; short promises are keepable.
dependencies = []

[project.optional-dependencies]
# Paraphrase matching in `recall`. Without it the gate still works and refuses MORE — the safe
# direction — and `memory_stats` reports which mode you are in.
semantic = ["sentence-transformers>=3.0"]

# Ed25519 signatures for erasure certificates. Without this the certificate is signed with HMAC,
# which is symmetric: only this install can verify it, so it detects tampering but proves nothing to
# a third party. With it, the public key is published beside the store and anyone holding it can
# verify a certificate without being able to forge one. The certificate states which it carries.
signing = ["cryptography>=42.0"]

[project.scripts]
fireweed-mcp = "fireweed_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Starksood/fireweed-mcp"
Source = "https://github.com/Starksood/fireweed-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/fireweed_mcp", "src/fireweed"]
